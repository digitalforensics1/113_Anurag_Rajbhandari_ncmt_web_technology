// <figure>: It is a semantic element that represents self‑contained content, 
//           usually an image, illustration, diagram, code snippet, or chart. 

        Function: It is used to group media content together with its caption.  
        Usages:   Use <figure> when you want to display an image or visual with a description. 
             
        Note: The caption is provided using the <figcaption> element inside <figure>.  

        extra key point: <figure> is different from a plain <img>.  
        - <img> only shows the image.  
        - <figure> + <figcaption> provides semantic meaning, linking the image with its description.  

        Code eg: <main>
                  <figure>
                    <img src="nature.jpg" alt="Beautiful Nature" width="200">
                    <figcaption>A scenic view of nature.</figcaption>
                  </figure>
                 </main>

                 note: 
                 1. <figure> is a container for media + caption.  
                 2. <img> is the actual image inside <figure>.  
                 3. <figcaption> describes or explains the image.  
                 4. Helps accessibility (screen readers) and SEO by connecting visuals with text.
